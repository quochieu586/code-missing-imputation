<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1050" width="620" height="1050">
  <rect width="100%" height="100%" fill="white"/>
  <text x="310" y="25" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">E3/E4 Experiment Pipeline Overview</text>
  <text x="310" y="42" font-size="11" text-anchor="middle" font-family="monospace">Mask-conditioning diagnostic (280 vs 1,120 updates, 2 policies)</text>
<rect x="20" y="60" width="580" height="50" fill="#E3F2FD" stroke="black" stroke-width="2"/><text x="30" y="76" font-size="12" font-weight="bold" font-family="monospace">Frozen Inputs</text><text x="30" y="94" font-size="10" font-family="monospace">covariants.csv + E0 CV fold 0 (SHA256 verified)</text><text x="30" y="107" font-size="10" font-family="monospace">E2 Transforms + positivity delta=0.5</text><rect x="20" y="120" width="580" height="50" fill="#E8F5E9" stroke="black" stroke-width="2"/><text x="30" y="136" font-size="12" font-weight="bold" font-family="monospace">Stage A Initializers</text><text x="30" y="154" font-size="10" font-family="monospace">Hron 2A / Aitchison Complete</text><text x="30" y="167" font-size="10" font-family="monospace">+ Linear/LOCF fallbacks (train-fitted)</text><rect x="20" y="180" width="580" height="50" fill="#FFF3E0" stroke="black" stroke-width="2"/><text x="30" y="196" font-size="12" font-weight="bold" font-family="monospace">Stage B: CSDICoreRework</text><text x="30" y="214" font-size="10" font-family="monospace">CLR16, C16, L8, heads=1, layers=2</text><text x="30" y="227" font-size="10" font-family="monospace">DDPM 20 steps, Adam LR=1e-3, MC=8</text><rect x="20" y="240" width="580" height="50" fill="#E1BEE7" stroke="black" stroke-width="2"/><text x="30" y="256" font-size="12" font-weight="bold" font-family="monospace">Training Loop</text><text x="30" y="274" font-size="10" font-family="monospace">2 Policies x 4 Modes x 3 Seeds = 24 trajectories</text><text x="30" y="287" font-size="10" font-family="monospace">7 updates/epoch, 160 epochs max</text><rect x="20" y="300" width="580" height="50" fill="#F8BBD0" stroke="black" stroke-width="2"/><text x="30" y="316" font-size="12" font-weight="bold" font-family="monospace">Mask Policies</text><text x="30" y="334" font-size="10" font-family="monospace">Control: 18 random-cell banks</text><text x="30" y="347" font-size="10" font-family="monospace">Intervention: 9 paired + 9 whole-variant</text><rect x="20" y="360" width="580" height="50" fill="#E0F2F1" stroke="black" stroke-width="2"/><text x="30" y="376" font-size="12" font-weight="bold" font-family="monospace">Checkpoint Select</text><text x="30" y="394" font-size="10" font-family="monospace">Fixed DK fixture: 103 rows x 13 windows x 20 steps x 3 n2 masks</text><text x="30" y="407" font-size="10" font-family="monospace">Budget280: ep 1-40; Budget1120: ep 1-160, earliest argmin</text><rect x="20" y="420" width="580" height="50" fill="#FFF8E1" stroke="black" stroke-width="2"/><text x="30" y="436" font-size="12" font-weight="bold" font-family="monospace">Evaluate</text><text x="30" y="454" font-size="10" font-family="monospace">48 entries x 4 scenarios = 192 records</text><text x="30" y="467" font-size="10" font-family="monospace">+ 16 shared Init-only/baseline controls</text><rect x="20" y="480" width="580" height="50" fill="#FFCDD2" stroke="black" stroke-width="2"/><text x="30" y="496" font-size="12" font-weight="bold" font-family="monospace">Validation Gates</text><text x="30" y="514" font-size="10" font-family="monospace">Conditioning: mask_only > no_init (FAIL)</text><text x="30" y="527" font-size="10" font-family="monospace">Efficacy: >10% M2 (FAIL); Numerical: (PASS)</text><rect x="20" y="540" width="580" height="50" fill="#FFCCBC" stroke="black" stroke-width="2"/><text x="30" y="556" font-size="12" font-weight="bold" font-family="monospace">E5 Status</text><text x="30" y="574" font-size="10" font-family="monospace">BLOCKED finalists=[]</text><text x="30" y="587" font-size="10" font-family="monospace">Canada SEALED</text></svg>