[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-imputation"
version = "0.1.0"
description = "Compositional longitudinal missing imputation for COVID-19 variant data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quoc Hieu", email = "quochieu586@example.com"}
]
keywords = ["missing-data", "compositional", "longitudinal", "covid-19", "imputation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]



[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.0",
]
gan = [
    "torch>=2.0.0",
]

[project.scripts]
missing-imputation = "missing_imputation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["missing_imputation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["tests/legacy", "legacy"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
    "parity: Parity tests",
    "slow: Slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T20", "SIM", "PIE",
]
ignore = ["E501", "B008"]
"per-file-ignores" = {"tests/*" = ["S101", "S106"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["src/missing_imputation"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]