[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longitudinal-impute"
version = "0.0.1"
description = "Full-table COVID-19 count imputation with three baseline models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
longitudinal-impute = "longitudinal_impute.cli:main"
general-impute = "longitudinal_impute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
